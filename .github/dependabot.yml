version: 2
updates:
  - package-ecosystem: npm
    directory: /back
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
